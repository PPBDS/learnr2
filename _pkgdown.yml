url: https://ppbds.github.io/learnr2/

template:
  bootstrap: 5

navbar:
  structure:
    left: [reference, articles, tutorials]
    right: [search, github]
  components:
    tutorials:
      text: Tutorials
      href: tutorials/index.html

reference:
  - title: Authoring tutorials
    desc: Scaffold and run interactive tutorials.
    contents:
      - create_tutorial
      - tutorial_options
      - run_tutorial
      - prerender_tutorials
      - available_tutorials
      - show_file
  - title: Testing tutorials
    desc: Confirm tutorials render and follow the authoring rules.
    contents:
      - render_tutorials
      - check_tutorial
  - title: Quiz questions
    desc: learnr-style quiz questions, graded in the browser.
    contents:
      - question
      - answer
      - quiz
  - title: Collecting student work
    desc: Gather reader identifying information and let them turn work in.
    contents:
      - student_info
      - download_answers_button
      - submission_time
  - title: Quarto-live extension
    desc: Manage the bundled quarto-live Quarto extension.
    contents:
      - add_live_extension
      - live_extension_dir
