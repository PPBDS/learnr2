# Renders every tutorial in inst/tutorials/ (via tools/render_tutorials_for_pages.R)
# and publishes the static HTML under the "tutorials/" path of the gh-pages
# branch already used by pkgdown.yaml. No server is involved at runtime: each
# tutorial runs entirely in the reader's browser via WebR, and
# download_answers_button() saves to a local file via browser JS -- so a
# plain static-file host is all GitHub Pages needs to provide.
on:
  push:
    branches: [main, master]
    paths:
      - 'inst/tutorials/**'
      - 'inst/extdata/**'
      - 'R/**'
      - 'tools/render_tutorials_for_pages.R'
      - '.github/workflows/tutorials.yaml'
  workflow_dispatch:

name: tutorials.yaml

permissions: read-all

jobs:
  tutorials:
    runs-on: ubuntu-latest
    concurrency:
      group: tutorials-${{ github.run_id }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.

      - name: Render tutorials
        run: Rscript tools/render_tutorials_for_pages.R

      - name: Deploy tutorials to GitHub Pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.8.0
        with:
          clean: false
          branch: gh-pages
          folder: _site/tutorials
          target-folder: tutorials
